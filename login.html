<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Vietnam Samho</title>
    <link rel="icon" type="image/webp" href="assets/icon/samho-icon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles_edited_v2.css?v=20260923-1" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="supabase/config.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/errors_edited.js" defer></script>
    <script src="assets/js/i18n.js?v=20260820-1" defer></script>
  </head>
  <body class="login-page app-standard">
    <main class="login-shell">
      <section class="login-card">
        <div class="login-logo">
          <img class="brand-mark" src="assets/icon/samho-icon.webp" alt="SamHo" />
          <div>
            <strong>Vietnam Samho</strong>
            <span data-i18n="login.subtitleTag"></span>
          </div>
        </div>

        <div class="login-card-head">
          <span data-i18n="login.welcome"></span>
          <h2 data-i18n="login.title"></h2>
          <p data-i18n="login.subtitle"></p>
        </div>

        <form id="loginForm" class="login-form">
          <label>
            <span data-i18n="login.userId"></span>
            <input id="loginUserId" type="text" autocomplete="username" required />
          </label>
          <label>
            <span data-i18n="login.password"></span>
            <input id="loginPassword" type="password" autocomplete="current-password" required />
          </label>
          <button id="loginButton" type="submit">
            <i data-lucide="log-in"></i>
            <span data-i18n="login.signIn"></span>
          </button>
          <p id="loginStatus" class="login-status" aria-live="polite"></p>
        </form>
      </section>
      <small class="login-copyright" data-i18n="login.copyright"></small>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) window.lucide.createIcons();

        const session = window.SAMHO_AUTH.getSession();
        if (window.SAMHO_AUTH.isSessionValid(session)) {
          location.replace(window.SAMHO_AUTH.homePage);
          return;
        }

        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const status = document.getElementById("loginStatus");

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          button.disabled = true;
          const t = (id) => window.SAMHO_LANG ? window.SAMHO_LANG.t(id) : "";
          status.textContent = t("login.signingIn");
          status.dataset.type = "loading";

          try {
            await window.SAMHO_AUTH.login(
              document.getElementById("loginUserId").value.trim(),
              document.getElementById("loginPassword").value
            );
            status.textContent = t("login.success");
            status.dataset.type = "success";
            location.replace(window.SAMHO_AUTH.homePage);
          } catch (error) {
            status.textContent = window.SAMHO_ERRORS.message(error, t("login.signIn").toLowerCase());
            status.dataset.type = "error";
          } finally {
            button.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>
