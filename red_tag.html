<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Red Tag - Vietnam Samho</title>
    <link rel="icon" type="image/webp" href="assets/icon/samho-icon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles_edited.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="supabase/config.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/errors_edited.js" defer></script>
    <script src="assets/js/i18n.js" defer></script>
    <script src="assets/js/datetime.js" defer></script>
    <script src="assets/js/db_client.js" defer></script>
    <script src="assets/js/sidebar.js" defer></script>
    <script src="https://unpkg.com/@zxing/browser@0.1.5" defer></script>
    <script src="assets/js/red_tag_edited.js" defer></script>
  </head>
  <body class="dashboard-app app-standard red-tag-page">
    <button class="icon-button sidebar-toggle" id="menuToggle" aria-label="Toggle sidebar" type="button"><i data-lucide="menu"></i></button>
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><img class="brand-mark" src="assets/icon/samho-icon.webp" alt="SamHo" /><div><strong>Vietnam Samho</strong><span data-i18n="brand.tagline"></span></div></div>
      <nav class="nav-list">
        <section class="nav-group active"><button class="nav-head" type="button" aria-expanded="true"><i data-lucide="wrench"></i><span data-i18n="nav.maintenance"></span><i data-lucide="chevron-down"></i></button><a href="repair_submit.html"><i data-lucide="clipboard-pen-line"></i><span data-i18n="nav.bm"></span></a><a href="repair_info.html"><i data-lucide="file-text"></i><span data-i18n="nav.repairInfo"></span></a><a href="kpi_dashboard.html"><i data-lucide="bar-chart-3"></i><span data-i18n="nav.kpi"></span></a></section>
        <section class="nav-group active"><button class="nav-head" type="button" aria-expanded="true"><i data-lucide="settings-2"></i><span data-i18n="nav.tpm"></span><i data-lucide="chevron-down"></i></button><a href="pm.html"><i data-lucide="calendar-check"></i><span data-i18n="nav.pm"></span></a></section>
        <section class="nav-group active"><button class="nav-head selected" type="button" aria-expanded="true"><i data-lucide="package-search"></i><span data-i18n="nav.sparepart"></span><i data-lucide="chevron-down"></i></button><a class="current" href="red_tag.html"><i data-lucide="tag"></i><span data-i18n="nav.redTag"></span></a><a href="spare_parts.html"><i data-lucide="boxes"></i><span data-i18n="nav.sparepartItem"></span></a><a href="incoming_stock.html"><i data-lucide="truck"></i><span data-i18n="nav.incoming"></span></a></section>
      </nav>
      <div class="sidebar-footer"><button class="logout sidebar-logout" type="button"><i data-lucide="log-out"></i><span data-i18n="nav.logout"></span></button><small class="app-copyright" data-i18n="app.copyright"></small></div>
    </aside>
    <div class="shell"><main class="content">
      <section class="info-panel spare-panel">
        <div class="info-title"><i data-lucide="tag"></i><h1 data-i18n="redtag.title">Red Tag</h1></div>
        <div class="info-filter spare-filter red-tag-filter catalog-filter" aria-label="Filter red tag machines" data-i18n-title="redtag.filterAria">
          <label><span><i data-lucide="factory"></i><span data-i18n="redtag.plant">Plant</span></span><select id="redTagPlantFilter"><option value="PLANT A" data-i18n="redtag.plantA">Plant A</option><option value="PLANT B" data-i18n="redtag.plantB">Plant B</option><option value="PLANT F" data-i18n="redtag.plantF">Plant F</option></select></label>
          <label><span><i data-lucide="search"></i><span data-i18n="common.search">Search</span></span><input id="redTagSearchInput" type="search" placeholder="Machine name" data-i18n-ph="redtag.searchPlaceholder" /></label>
          <div class="red-tag-filter-actions"><button class="info-search control-icon-button" id="redTagAddButton" type="button" aria-label="Add Red Tag record" title="Add Red Tag record" data-i18n-title="redtag.addRecord"><i data-lucide="plus"></i></button></div>
        </div>
        <p class="info-status red-tag-status" id="redTagStatus" aria-live="polite"></p>
      </section>
      <section class="repair-list" aria-label="Red tag machines" data-i18n-title="redtag.listAria">
        <div class="repair-table-wrap spare-table-wrap">
          <table class="repair-table red-tag-table"><thead><tr><th data-i18n="redtag.no">No.</th><th data-i18n="redtag.machineName">Machine Name</th><th data-i18n="redtag.quantity">Quantity</th><th data-i18n="redtag.detail">Detail</th></tr></thead><tbody id="redTagList"><tr><td colspan="4" data-i18n="redtag.loading">Loading machines…</td></tr></tbody></table>
        </div>
        <p class="red-tag-table-summary" id="redTagSummary"></p>
        <div class="repair-pagination" id="redTagPagination" hidden></div>
      </section>
    </main></div>
    <div class="repair-modal" id="redTagModal" aria-hidden="true">
      <div class="repair-modal-backdrop" data-close-red-tag></div>
      <section class="repair-modal-dialog red-tag-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="redTagModalTitle">
        <header class="repair-modal-header"><h2 id="redTagModalTitle" data-i18n="redtag.machineTypes">Machine Types</h2><button class="repair-modal-close" type="button" data-close-red-tag aria-label="Close" data-i18n-title="redtag.close"><i data-lucide="x"></i></button></header>
        <div class="incoming-stock-modal-list" id="redTagModalList"></div>
      </section>
    </div>
    <div class="repair-modal" id="redTagAddModal" aria-hidden="true">
      <div class="repair-modal-backdrop" data-close-red-tag-add></div>
      <form class="repair-modal-dialog" id="redTagAddForm">
        <header class="repair-modal-header"><h2 data-i18n="redtag.addTitle">Add Red Tag Record</h2><button class="repair-modal-close" type="button" data-close-red-tag-add aria-label="Close" data-i18n-title="redtag.close"><i data-lucide="x"></i></button></header>
        <div class="repair-modal-grid">
          <label><span data-i18n="redtag.plant">Plant</span><select name="plant" required><option value="PLANT A" data-i18n="redtag.plantA">Plant A</option><option value="PLANT B" data-i18n="redtag.plantB">Plant B</option><option value="PLANT F" data-i18n="redtag.plantF">Plant F</option></select></label>
          <label><span data-i18n="redtag.itemCode">Item Code</span><div class="red-tag-code-control"><input name="itemCode" id="redTagAddItemCode" type="text" autocomplete="off" placeholder="Scan or enter Item Code" data-i18n-ph="redtag.itemCodePlaceholder" required /><button class="info-search control-icon-button" id="redTagMachineSearch" type="button" aria-label="Search Item Code" title="Search Item Code" data-i18n-title="redtag.searchItemCode"><i data-lucide="search"></i></button><button class="info-search control-icon-button" id="redTagScanButton" type="button" aria-label="Scan barcode" title="Scan barcode" data-i18n-title="redtag.scanBarcode"><i data-lucide="scan-line"></i></button></div></label>
          <label><span data-i18n="redtag.machineName">Machine Name</span><input name="machineName" id="redTagAddMachineName" type="text" disabled required /></label>
          <label><span data-i18n="redtag.date">Date</span><input name="date" type="date" required /></label>
          <label><span data-i18n="redtag.line">Line</span><input name="line" type="text" required /></label>
          <label><span data-i18n="redtag.status">Status</span><select name="status" id="redTagAddStatusSelect" required><option value="Máy Dự Phòng" data-i18n="redtag.statusStandby">Máy Dự Phòng</option><option value="Máy Hư Chờ Sửa" data-i18n="redtag.statusBroken">Máy Hư Chờ Sửa</option></select></label>
          <label id="redTagAddIssueField" hidden><span data-i18n="redtag.issue">Issue</span><input name="issue" id="redTagAddIssueInput" type="text" /></label>
        </div>
        <footer class="repair-modal-footer"><p class="repair-modal-status red-tag-add-status" id="redTagAddStatus" aria-live="polite"></p><button class="btn muted" type="button" data-close-red-tag-add data-i18n="redtag.cancel">Cancel</button><button class="save" id="redTagAddSave" type="submit"><i data-lucide="save"></i><span data-i18n="common.save">Save</span></button></footer>
      </form>
    </div>
    <div class="scan-modal" id="redTagScanModal" aria-hidden="true">
      <div class="scan-backdrop" data-close-red-tag-scan></div>
      <section class="scan-dialog" role="dialog" aria-modal="true" aria-labelledby="redTagScanTitle">
        <header><div><span data-i18n="redtag.scanTitle">Barcode scanner</span><h2 id="redTagScanTitle" data-i18n="redtag.scanHeading">Scan Item Code</h2></div><button class="scan-close" type="button" data-close-red-tag-scan aria-label="Close scanner" data-i18n-title="redtag.closeScanner"><i data-lucide="x"></i></button></header>
        <div class="scan-video-wrap"><video id="redTagScanVideo" autoplay playsinline muted></video><div class="scan-frame"></div></div>
        <p class="scan-status" id="redTagScanStatus" aria-live="polite" data-i18n="redtag.scanPoint">Point the camera at a barcode.</p>
      </section>
    </div>
  </body>
</html>
