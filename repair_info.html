<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repair Information - Vietnam Samho</title>
    <style>
      .repair-table th:first-child,
      .repair-table td:first-child {
        text-align: center;
        width: 50px;
        min-width: 50px;
        max-width: 50px;
      }
    </style>
    <link rel="icon" type="image/webp" href="assets/icon/samho-icon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles_edited.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="supabase/config.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/errors_edited.js" defer></script>
    <script src="assets/js/i18n.js" defer></script>
    <script src="assets/js/datetime.js" defer></script>
    <script src="assets/js/db_client.js" defer></script>
    <script src="assets/js/sidebar.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
    <script src="assets/js/app_edited.js" defer></script>
    <script src="assets/js/repair_info_edited.js" defer></script>
  </head>
  <body class="dashboard-app app-standard repair-info-page">
    <button class="icon-button sidebar-toggle" id="menuToggle" aria-label="Toggle sidebar" type="button">
      <i data-lucide="menu"></i>
    </button>

    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <img class="brand-mark" src="assets/icon/samho-icon.webp" alt="SamHo" />
        <div>
          <strong>Vietnam Samho</strong>
          <span data-i18n="brand.tagline"></span>
        </div>
      </div>

      <nav class="nav-list">
        <section class="nav-group active">
          <button class="nav-head selected" type="button" aria-expanded="true">
            <i data-lucide="wrench"></i>
            <span data-i18n="nav.maintenance"></span>
            <i data-lucide="chevron-down"></i>
          </button>
          <a href="repair_submit.html"><i data-lucide="clipboard-pen-line"></i><span data-i18n="nav.bm"></span></a>
          <a class="current" href="repair_info.html"><i data-lucide="file-text"></i><span data-i18n="nav.repairInfo"></span></a>
          <a href="kpi_dashboard.html"><i data-lucide="bar-chart-3"></i><span data-i18n="nav.kpi"></span></a>
        </section>

        <section class="nav-group active">
          <button class="nav-head" type="button" aria-expanded="true">
            <i data-lucide="settings-2"></i><span data-i18n="nav.tpm"></span><i data-lucide="chevron-down"></i>
          </button>
          <a href="pm.html"><i data-lucide="calendar-check"></i><span data-i18n="nav.pm"></span></a>
        </section>

        <section class="nav-group active">
          <button class="nav-head" type="button" aria-expanded="true">
            <i data-lucide="package-search"></i>
            <span data-i18n="nav.sparepart"></span>
            <i data-lucide="chevron-down"></i>
          </button>
          <a href="red_tag.html"><i data-lucide="tag"></i><span data-i18n="nav.redTag"></span></a>
          <a href="spare_parts.html"><i data-lucide="boxes"></i><span data-i18n="nav.sparepartItem"></span></a>
          <a href="incoming_stock.html"><i data-lucide="truck"></i><span data-i18n="nav.incoming"></span></a>
        </section>
      </nav>

      <div class="sidebar-footer">
        <button class="logout sidebar-logout" type="button">
          <i data-lucide="log-out"></i>
          <span data-i18n="nav.logout"></span>
        </button>
        <small class="app-copyright" data-i18n="app.copyright"></small>
      </div>
    </aside>

    <div class="shell">
      <main class="content">
        <section class="page-view active" id="repairInfoView">
          <div class="info-panel">
            <div class="info-title">
              <i data-lucide="wrench"></i>
              <h1 data-i18n="repairInfo.title">Thông tin máy hư</h1>
            </div>

            <form class="info-filter" id="repairInfoFilter">
              <label>
                <span><i data-lucide="calendar-days"></i><span data-i18n="repairInfo.from">Từ</span></span>
                <input id="fromDate" type="date" required />
              </label>
              <label>
                <span><i data-lucide="calendar-days"></i><span data-i18n="repairInfo.to">Đến</span></span>
                <input id="toDate" type="date" required />
              </label>
              <label>
                <span><i data-lucide="scan-line"></i><span data-i18n="repairInfo.itemCode">Item Code</span></span>
                <input id="infoItemCode" type="search" placeholder="ITEM CODE" data-i18n-ph="repairInfo.itemCodePh" />
              </label>
              <label>
                <span><i data-lucide="factory"></i><span data-i18n="repairInfo.plant">Plant</span></span>
                <div class="scroll-select" id="infoPlantPicker">
                  <button class="scroll-select-trigger" id="infoPlantTrigger" type="button" aria-expanded="false">
                    <span data-i18n="common.allPlant">ALL PLANT</span>
                  </button>
                  <input id="infoPlant" type="hidden" value="" />
                  <div class="scroll-select-menu" id="infoPlantMenu" role="listbox" aria-label="Plant options" data-i18n-title="repairInfo.plantOptions"></div>
                </div>
              </label>
              <div class="repair-info-actions">
              <button class="info-search" id="repairInfoSearch" type="submit">
                <i data-lucide="search"></i>
                <span data-i18n="common.search">Tìm kiếm</span>
              </button>
              <button class="repair-info-export control-icon-button" id="repairInfoExport" type="button" disabled aria-label="Export current records to Excel" title="Export Excel" data-i18n-title="repairInfo.exportExcel">
                <i data-lucide="download"></i>
              </button>
              </div>
              <p class="info-status" id="repairInfoStatus" aria-live="polite"></p>
            </form>
          </div>

          <section class="repair-list" id="repairList" aria-label="Danh sách máy hư" data-i18n-title="repairInfo.listAria"></section>
        </section>
      </main>
    </div>
  </body>
</html>
